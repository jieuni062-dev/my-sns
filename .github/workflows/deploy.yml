name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Actions 탭에서 직접 실행할 수도 있게
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 것은 끝까지 두고 대기 중인 것만 최신으로 바꾼다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # 주소 경로(/my-sns/)는 vite.config.ts 의 base 에 적혀 있다
      # 키는 저장소에 올리지 않고 GitHub Secrets 에서 읽는다
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
